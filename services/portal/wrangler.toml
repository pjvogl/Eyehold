name = "eyehold"
main = "src/worker.js"
compatibility_date = "2026-11-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
upload_source_maps = true

# Eyehold's own Worker.
# Deployed in TEST MODE 2026-11-25 with eyehold.babelbook.net attached as a
# Workers custom domain, behind Cloudflare Access. Do not add any other hostname.
[[routes]]
pattern = "eyehold.babelbook.net"
custom_domain = true

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[vars]
EYEHOLD_BASE_DOMAIN = "eyehold.babelbook.net"
STRIPE_MODE = "test"

# Names only. Values are set with `npx wrangler secret put` from this directory.
# Never put key material in this file.
[secrets]
required = ["STRIPE_SECRET_KEY", "STRIPE_WEBHOOK_SECRET", "EYEHOLD_ACCESS_EMAILS"]

# Optional, not required for the first login-gated deploy:
# EYEHOLD_ACCESS_CLIENT_ID
# EYEHOLD_ACCESS_CLIENT_SECRET

# Eyehold billing ledger, namespace "eyehold-BILLING_KV", created 2026-11-25.
[[kv_namespaces]]
binding = "BILLING_KV"
id = "c59822282bcf4f1294f4522c7f07a026"
